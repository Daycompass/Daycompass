[package]
name = "screenward-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Screenward self-hosted backend: config, SQLite storage, and a hardened HTTP skeleton with /healthz. No users, auth, or domain tables yet."

[lints]
workspace = true

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
argon2 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true }
ipnet = { workspace = true }

[dev-dependencies]
# "io-util" for AsyncReadExt/AsyncWriteExt, used only by the test that
# speaks raw HTTP/1.1 over a real socket. A feature of a crate already
# in the graph, not a new dependency, and enabled for test builds only.
tokio = { workspace = true, features = ["io-util"] }
# Already in the dependency graph transitively (axum's JSON support);
# declared directly here so integration tests can parse response bodies.
# A dev-dependency only - never part of the shipped binary.
serde_json = { version = "~1.0" }
