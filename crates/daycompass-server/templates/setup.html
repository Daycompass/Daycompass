{% extends "layout_solo.html" %}
{% block title %}Set up{% endblock %}
{% block content %}
<div class="dc-card dc-stack">
  <h1 class="dc-heading-2">Set up Daycompass</h1>
  <p class="dc-muted">Create the first admin account. The setup token is in the server's log output from when it started.</p>
  <div id="dc-flash" class="dc-flash" aria-live="polite"></div>
  <form class="dc-stack" method="post" action="/setup" hx-post="/setup" hx-disabled-elt="find button">
    <div class="dc-field">
      <label class="dc-field__label" for="setup_token">Setup token</label>
      <input class="dc-field__input" id="setup_token" name="setup_token" type="password" autocomplete="off" spellcheck="false" required>
    </div>
    <div class="dc-field">
      <label class="dc-field__label" for="username">Username</label>
      <input class="dc-field__input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="dc-field">
      <label class="dc-field__label" for="password">Password</label>
      <input class="dc-field__input" id="password" name="password" type="password" autocomplete="new-password" required>
    </div>
    <button class="dc-btn dc-btn--primary dc-btn--block" type="submit"><span class="dc-spin" aria-hidden="true"></span>Create admin</button>
  </form>
</div>
{% endblock %}
