{#- The design system's icons: 24px grid, 2px stroke, round caps.
    Decorative; the text next to them carries the meaning. #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "today" %}<path d="M4 20V11M10 20V6M16 20v-6M22 20H2"/>
{%- else if name == "check" %}<path d="M20 6 9 17l-5-5"/>
{%- else if name == "warning" %}<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/>
{%- else if name == "error" %}<path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM15 9l-6 6M9 9l6 6"/>
{%- else if name == "close" %}<path d="M18 6 6 18M6 6l12 12"/>
{%- else %}<path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01"/>
{%- endif -%}
</svg>
{%- endmacro %}
