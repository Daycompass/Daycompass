{% extends "layout_solo.html" %}
{% import "macros.html" as icons %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="dc-card dc-stack" data-error-code="{{ code }}">
  <h1 class="dc-heading-2">{{ title }}</h1>
  <p>{{ message }}</p>
  <p class="dc-caption">Error {{ status }} · {{ code }}</p>
  <a class="dc-btn dc-btn--neutral dc-btn--block" href="/">Back to the overview</a>
</div>
{% endblock %}
