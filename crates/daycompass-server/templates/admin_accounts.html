{% extends "layout_app.html" %}
{% import "macros.html" as icons %}
{% block title %}Accounts{% endblock %}
{% block content %}
<header class="dc-page-head">
  <span class="dc-overline">Admin</span>
  <h1 class="dc-heading-1">Accounts</h1>
</header>
<div class="dc-stack dc-stack--lg">
  <section class="dc-card dc-stack">
    <h2 class="dc-heading-3">Invite someone</h2>
    <p class="dc-muted">Creates the account and an invite code. They choose their own password at /invite.</p>
    <form class="dc-stack" method="post" action="/admin/users" hx-post="/admin/users" hx-target="#accounts" hx-swap="outerHTML" hx-disabled-elt="find button">
      <div class="dc-field">
        <label class="dc-field__label" for="username">Username</label>
        <input class="dc-field__input" id="username" name="username" type="text" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="dc-field">
        <label class="dc-field__label" for="role">Role</label>
        <select class="dc-field__input" id="role" name="role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div><button class="dc-btn dc-btn--primary" type="submit">{% call icons::icon("plus") %}{% endcall %}<span class="dc-spin" aria-hidden="true"></span>Create invite</button></div>
    </form>
  </section>
  {{ list|safe }}
</div>
{% endblock %}
