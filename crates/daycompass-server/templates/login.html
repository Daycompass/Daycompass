{% extends "layout_solo.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="dc-card dc-stack">
  <h1 class="dc-heading-2">Log in</h1>
  <div id="dc-flash" class="dc-flash" aria-live="polite"></div>
  {#- Works without JavaScript as a plain form post; with htmx, errors
      appear above instead of on a page of their own. #}
  <form class="dc-stack" method="post" action="/login" hx-post="/login" hx-disabled-elt="find button">
    <div class="dc-field">
      <label class="dc-field__label" for="username">Username</label>
      <input class="dc-field__input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="dc-field">
      <label class="dc-field__label" for="password">Password</label>
      <input class="dc-field__input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="dc-btn dc-btn--primary dc-btn--block" type="submit"><span class="dc-spin" aria-hidden="true"></span>Log in</button>
  </form>
</div>
{% endblock %}
