{% import "macros.html" as icons -%}
<section id="timezone" class="dc-card dc-stack">
  <h2 class="dc-heading-3">Time zone</h2>
  <p class="dc-muted">Where your day starts and ends in the overview and in stats read with <code>day_boundary=account</code>.</p>
  {% if saved %}
  <div class="dc-banner dc-banner--success" role="status">{% call icons::icon("check") %}{% endcall %}<div><b>Time zone saved.</b></div></div>
  {% endif %}
  <form class="dc-stack" method="post" action="/account/timezone" hx-post="/account/timezone" hx-target="#timezone" hx-swap="outerHTML" hx-disabled-elt="find button">
    <div class="dc-field">
      <label class="dc-field__label" for="timezone_name">Time zone</label>
      <input class="dc-field__input" id="timezone_name" name="timezone" type="text" list="timezone_names" value="{{ current }}" autocomplete="off" spellcheck="false" required>
      <datalist id="timezone_names">
        {% for name in names %}<option value="{{ name }}"></option>{% endfor %}
      </datalist>
    </div>
    <div><button class="dc-btn dc-btn--primary" type="submit"><span class="dc-spin" aria-hidden="true"></span>Save time zone</button></div>
  </form>
</section>
