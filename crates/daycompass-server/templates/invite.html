{% extends "layout_solo.html" %}
{% block title %}Accept invite{% endblock %}
{% block content %}
<div class="dc-card dc-stack">
  <h1 class="dc-heading-2">Accept your invite</h1>
  <p class="dc-muted">Paste the invite code your admin gave you and choose a password. Then log in.</p>
  <div id="dc-flash" class="dc-flash" aria-live="polite"></div>
  <form class="dc-stack" method="post" action="/invite" hx-post="/invite" hx-disabled-elt="find button">
    <div class="dc-field">
      <label class="dc-field__label" for="invite_token">Invite code</label>
      <input class="dc-field__input" id="invite_token" name="invite_token" type="password" autocomplete="off" spellcheck="false" required>
    </div>
    <div class="dc-field">
      <label class="dc-field__label" for="new_password">New password</label>
      <input class="dc-field__input" id="new_password" name="new_password" type="password" autocomplete="new-password" required>
    </div>
    <button class="dc-btn dc-btn--primary dc-btn--block" type="submit"><span class="dc-spin" aria-hidden="true"></span>Activate account</button>
  </form>
  <a class="dc-caption" href="/login">Already active? Log in</a>
</div>
{% endblock %}
