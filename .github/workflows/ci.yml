name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep these in sync with the versions pinned/checksummed below.
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_AUDIT_VERSION: "0.22.2"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -- -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: cargo test --locked
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - run: cargo test --locked --all-targets

  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Install cargo-deny (pinned version)
        run: cargo install cargo-deny --version "${CARGO_DENY_VERSION}" --locked
      - run: cargo deny check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - name: Install cargo-audit (pinned version)
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked
      - run: cargo audit

  # Builds the release image the way an operator would, starts it, and
  # asks it for /healthz. Nothing is pushed anywhere and no registry is
  # logged into. Catches a Dockerfile that stopped building (a base image
  # bump, a crate needing a system library) and a binary that builds but
  # does not run in the distroless runtime.
  container:
    name: container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dockerfile builds with the pinned toolchain
        run: scripts/check-dockerfile-toolchain.sh
      - name: Build the image (no push)
        run: docker build --pull -t daycompass:ci .
      - name: Runs as the unprivileged user
        run: |
          set -eu
          user=$(docker image inspect --format '{{.Config.User}}' daycompass:ci)
          echo "image user: ${user}"
          test "${user}" = "65532:65532"
      - name: Starts and answers /healthz
        run: |
          set -eu
          # A placeholder origin: binding beyond loopback inside the
          # container makes DAYCOMPASS_PUBLIC_URL mandatory.
          docker run -d --name daycompass-ci -p 127.0.0.1:8080:8080 \
            -e DAYCOMPASS_PUBLIC_URL=http://127.0.0.1:8080 daycompass:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "the container never answered /healthz" >&2
          docker logs daycompass-ci >&2
          exit 1

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks (pinned release binary, checksum-verified)
        run: |
          set -eu
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o gitleaks.tar.gz "${url}"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Verify the Daycompass token rules
        run: .githooks/tests/gitleaks-rules.sh
      - run: gitleaks git --redact --config .gitleaks.toml .
