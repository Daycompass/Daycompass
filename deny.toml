# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
# Only licenses compatible with distributing this AGPL-3.0-only project.
# Identifiers are exact SPDX license IDs (cargo-deny matches them
# verbatim, not fuzzily).
allow = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
# Kept at "warn", not "deny", because the dependency graph unavoidably
# contains two generations of the RustCrypto crates: sqlx-core depends on
# the 0.10 generation (sha2 0.10 -> digest 0.10), while argon2 0.6 pulls
# the 0.11 generation (blake2 0.11 -> digest 0.11). That accounts for the
# duplicate sha2/digest/block-buffer/crypto-common/cpufeatures entries.
# Both generations enter the graph as soon as argon2 is present, so this
# cannot be resolved from our side; it goes away once sqlx moves up.
# No "ignore" entries - the warnings stay visible on purpose.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path-dependency members are not on crates.io and have
# no version to pin; this applies the wildcard rule only to real external
# dependencies, not to internal "path = ..." crates like screenwarden-proto.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
