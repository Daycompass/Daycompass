[workspace]
resolver = "2"
members = [
    "crates/daycompass-proto",
    "crates/daycompass-server",
]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-only"
publish = false

# Shared lint configuration for every workspace member. Each crate opts in
# via `[lints] workspace = true` in its own Cargo.toml.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Pinned to an exact minor version (tilde requirement): patch releases
# are picked up automatically, minor/major bumps require a deliberate
# Cargo.toml edit (and a Dependabot PR to review).
[workspace.dependencies]
tokio = { version = "~1.54", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    # "sync": Semaphore, to cap concurrent Argon2 hashes.
    # "time": the periodic session/setup-token cleanup task.
    # "net": TcpListener. Enabled transitively by axum anyway; named
    # here so the binary does not depend on that staying true.
    "sync",
    "time",
    "net",
] }
axum = { version = "~0.8" }
tower = { version = "~0.5", features = ["util", "timeout"] }
tower-http = { version = "~0.7", features = ["request-id", "set-header"] }
sqlx = { version = "~0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "sqlite-bundled",
    "migrate",
    # Needed for the `sqlx::migrate!()` macro that embeds migrations into
    # the binary at compile time (vs. reading them from disk at runtime).
    # Adds no driver/TLS surface - verified via `cargo tree`.
    "macros",
] }
serde = { version = "~1.0", features = ["derive"] }
thiserror = { version = "~2.0" }
tracing = { version = "~0.1" }
tracing-subscriber = { version = "~0.3", features = ["json", "env-filter"] }

# Argon2id password hashing. `Params::DEFAULT` is exactly the OWASP
# minimum (m=19456 KiB, t=2, p=1), and `TryFrom<&PasswordHash> for Params`
# reads a stored hash's parameters back, which is what makes
# rehash-on-weaker-parameters possible. The "zeroize" feature wipes the
# internal memory blocks after hashing.
argon2 = { version = "~0.6", features = ["zeroize"] }
# SHA-256, for hashing session/setup tokens before storing them and for
# deriving the per-session CSRF token.
sha2 = { version = "~0.11" }
# Constant-time equality for CSRF and token comparisons.
subtle = { version = "~2.6" }
# Wipes the in-memory password wrapper on drop.
zeroize = { version = "~1.9" }
# base64url without padding, for the 43-character token body. Pinned to
# 0.22 rather than 0.23 deliberately: 0.22 is already in the dependency
# graph via sqlx, so this adds no second version of the crate.
base64 = { version = "~0.23" }
# UUID v7 identifiers (time-ordered, so they index well in SQLite).
uuid = { version = "~1.28", features = ["v7"] }
# 32 random bytes straight from the OS CSPRNG. Already in the graph via
# uuid; declared directly because token generation depends on it.
getrandom = { version = "~0.4" }
# CIDR parsing and containment checks for DAYCOMPASS_TRUSTED_PROXIES.
# Hand-rolling IPv6 prefix matching is error-prone; this crate has no
# dependencies of its own.
ipnet = { version = "~2.12" }
# Serializes the account export one page at a time, rather than through
# axum's `Json`, which needs the whole document in memory. Already in the
# graph via axum.
serde_json = { version = "~1.0" }
# `stream::unfold`, which turns the export's page-by-page reads into the
# response body. Already in the graph via axum; no default features
# needed for it.
futures-util = { version = "~0.3", default-features = false }
