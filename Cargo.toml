[workspace]
resolver = "2"
members = [
    "crates/screenward-proto",
    "crates/screenward-server",
]

[workspace.package]
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-only"
publish = false

# Shared lint configuration for every workspace member. Each crate opts in
# via `[lints] workspace = true` in its own Cargo.toml.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Pinned to an exact minor version (tilde requirement): patch releases
# are picked up automatically, minor/major bumps require a deliberate
# Cargo.toml edit (and a Dependabot PR to review).
[workspace.dependencies]
tokio = { version = "~1.54", features = ["rt-multi-thread", "macros", "signal"] }
axum = { version = "~0.8" }
tower = { version = "~0.5", features = ["util", "timeout"] }
tower-http = { version = "~0.7", features = ["request-id", "set-header"] }
sqlx = { version = "~0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "sqlite-bundled",
    "migrate",
    # Needed for the `sqlx::migrate!()` macro that embeds migrations into
    # the binary at compile time (vs. reading them from disk at runtime).
    # Adds no driver/TLS surface - verified via `cargo tree`.
    "macros",
] }
serde = { version = "~1.0", features = ["derive"] }
thiserror = { version = "~2.0" }
tracing = { version = "~0.1" }
tracing-subscriber = { version = "~0.3", features = ["json", "env-filter"] }
